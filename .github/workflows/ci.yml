name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: uv sync --group hf
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
        env:
          CHARCOT_REQUIRE_BROWSER: "1"
      - run: uv run python scripts/maintenance.py check
      - run: uv run python scripts/maintenance.py tasks --check
      - run: uv run python scripts/maintenance.py report --check
      - run: uv run python scripts/maintenance.py bands --check
      - run: uv build
      - name: Check package contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          for wheel in Path("dist").glob("*.whl"):
              names = zipfile.ZipFile(wheel).namelist()
              assert not any(set(name.split("/")) & {"private", "internal"} for name in names)
          for archive in Path("dist").glob("*.tar.gz"):
              with tarfile.open(archive) as sdist:
                  names = sdist.getnames()
              assert not any(set(name.split("/")) & {"private", "internal"} for name in names)
          PY
