<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1151.0" viewBox="0 0 640 1151.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="60" y="58" font-size="24" font-weight="600" text-anchor="start" fill="#111">Clinical reasoning in complex cases</text>
<text x="60" y="84" font-size="14" font-weight="400" text-anchor="start" fill="#666">How a case unfolds: commit, act, reassess</text>
<rect x="180.0" y="145" width="400" height="74" rx="2" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="196.0" y="172" font-size="13" font-weight="500" text-anchor="start" fill="#888">1</text>
<text x="224.0" y="172" font-size="16" font-weight="600" text-anchor="start" fill="#111">Presentation</text>
<text x="224.0" y="192" font-size="13" font-weight="400" text-anchor="start" fill="#444">Who the patient is, what changed, why now.</text>
<line x1="380" y1="219" x2="380" y2="252" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<polygon points="380,252.0 495.0,289 380,326.0 265.0,289" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="380" y="294" font-size="14" font-weight="600" text-anchor="middle" fill="#111">Immediate risk?</text>
<rect x="40" y="255" width="150" height="68" rx="2" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="52" y="277" font-size="14" font-weight="600" text-anchor="start" fill="#111">Stabilize now</text>
<text x="52" y="297" font-size="12" font-weight="400" text-anchor="start" fill="#444">in parallel, without</text>
<text x="52" y="311" font-size="12" font-weight="400" text-anchor="start" fill="#444">waiting for a diagnosis</text>
<line x1="265.0" y1="289" x2="190" y2="289" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<text x="253.0" y="281" font-size="12" font-weight="500" text-anchor="end" fill="#111">yes</text>
<line x1="380" y1="326.0" x2="380" y2="366.0" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<text x="388" y="350.0" font-size="12" font-weight="500" text-anchor="start" fill="#111">no</text>
<path d="M115.0,323 L115.0,403.0 L180.0,403.0" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="180.0" y="366.0" width="400" height="74" rx="2" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="196.0" y="393.0" font-size="13" font-weight="500" text-anchor="start" fill="#888">2</text>
<text x="224.0" y="393.0" font-size="16" font-weight="600" text-anchor="start" fill="#111">First-hand data</text>
<text x="224.0" y="413.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">History, exam, labs and imaging — look at the</text>
<text x="224.0" y="430.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">image, not only the report; compare with baseline.</text>
<line x1="380" y1="440.0" x2="380" y2="476.0" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="180.0" y="476.0" width="400" height="74" rx="2" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="196.0" y="503.0" font-size="13" font-weight="500" text-anchor="start" fill="#888">3</text>
<text x="224.0" y="503.0" font-size="16" font-weight="600" text-anchor="start" fill="#111">Problem synthesis</text>
<text x="224.0" y="523.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">One sentence: context + key findings.</text>
<text x="224.0" y="540.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">Pick the pivot finding.</text>
<line x1="380" y1="550.0" x2="380" y2="586.0" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="180.0" y="586.0" width="400" height="74" rx="2" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="196.0" y="613.0" font-size="13" font-weight="500" text-anchor="start" fill="#888">4</text>
<text x="224.0" y="613.0" font-size="16" font-weight="600" text-anchor="start" fill="#111">Differential: broad → narrow</text>
<text x="224.0" y="633.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">By category; test each hypothesis against</text>
<text x="224.0" y="650.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">every finding (what fits, what does not).</text>
<line x1="380" y1="660.0" x2="380" y2="696.0" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="180.0" y="696.0" width="400" height="74" rx="2" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="196.0" y="723.0" font-size="13" font-weight="500" text-anchor="start" fill="#888">5</text>
<text x="224.0" y="723.0" font-size="16" font-weight="600" text-anchor="start" fill="#111">Working hypothesis</text>
<text x="224.0" y="743.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">Commit to the one that explains everything,</text>
<text x="224.0" y="760.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">keeping the can't-miss diagnosis in view.</text>
<line x1="380" y1="770.0" x2="380" y2="806.0" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="180.0" y="806.0" width="400" height="74" rx="2" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="196.0" y="833.0" font-size="13" font-weight="500" text-anchor="start" fill="#888">6</text>
<text x="224.0" y="833.0" font-size="16" font-weight="600" text-anchor="start" fill="#111">Next step by risk and benefit</text>
<text x="224.0" y="853.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">Test (highest yield, lowest risk),</text>
<text x="224.0" y="870.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">treat empirically, or watch.</text>
<line x1="380" y1="880.0" x2="380" y2="913.0" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<polygon points="380,913.0 505.0,950.0 380,987.0 255.0,950.0" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="380" y="955.0" font-size="14" font-weight="600" text-anchor="middle" fill="#111">Do new data fit?</text>
<text x="243.0" y="942.0" font-size="12" font-weight="500" text-anchor="end" fill="#111">no</text>
<path d="M255.0,950.0 L60,950.0 L60,513.0 L180.0,513.0" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<text x="70" y="970.0" font-size="12" font-weight="400" text-anchor="start" fill="#444">redo the synthesis</text>
<line x1="380" y1="987.0" x2="380" y2="1027.0" stroke="#111" stroke-width="1.2" marker-end="url(#a)"/>
<text x="388" y="1011.0" font-size="12" font-weight="500" text-anchor="start" fill="#111">yes</text>
<rect x="180.0" y="1027.0" width="400" height="74" rx="2" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="196.0" y="1054.0" font-size="13" font-weight="500" text-anchor="start" fill="#888">7</text>
<text x="224.0" y="1054.0" font-size="16" font-weight="600" text-anchor="start" fill="#111">Diagnosis and plan</text>
<text x="224.0" y="1074.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">Definitive confirmation, tailored treatment,</text>
<text x="224.0" y="1091.0" font-size="13" font-weight="400" text-anchor="start" fill="#444">and a look back at what anchored the reasoning.</text>
</svg>