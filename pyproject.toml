[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "charcot-gym"
version = "0.1.0"
description = "A reinforcement learning environment and benchmark for clinical AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Charcot AI" }]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.34"]

[project.scripts]
charcot-gym = "charcot_gym.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/charcot_gym"]

[tool.hatch.build]
include = ["src/charcot_gym/tasks/**/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PL", "T20", "D", "RUF"]
ignore = ["D105", "D107", "D203", "D213", "D401", "PLR0911", "PLR0912", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
"scripts/**" = ["D", "PLR2004", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
