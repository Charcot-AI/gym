[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "charcot-gym"
version = "0.1.0"
description = "A reinforcement learning environment and benchmark for clinical AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Charcot AI" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.34"]
ehr-web = ["fastapi>=0.115", "uvicorn>=0.34", "playwright>=1.55", "Pillow>=11"]

[project.scripts]
charcot-gym = "charcot_gym.cli:main"

[dependency-groups]
dev = ["fastapi>=0.115", "mypy>=1.13", "Pillow==11.3.0", "playwright>=1.55", "pytest>=8.3", "ruff>=0.8", "uvicorn>=0.34"]

[tool.hatch.build.targets.wheel]
packages = ["src/charcot_gym"]

[tool.hatch.build]
include = [
    "src/charcot_gym/data/**/*.json",
    "src/charcot_gym/synth/*.json",
    "src/charcot_gym/runner/*.json",
    "src/charcot_gym/tasks/**/*.json",
    "src/charcot_gym/tasks/**/*.png",
    "src/charcot_gym/assets/fonts/*",
]
exclude = ["private/**", "internal/**"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PL", "T20", "D", "RUF"]
ignore = ["D105", "D107", "D203", "D213", "D401", "PLR0911", "PLR0912", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
"tests/quality.py" = ["PLC0415"]
"tests/test_ehr_web.py" = ["PLC0415"]
"tests/test_ehr_web_browser.py" = ["PLC0415"]
"scripts/**" = ["D", "PLR2004", "T20", "PLC0415"]
"src/charcot_gym/ehr_web/*.py" = [
    "D101",
    "D102",
    "D103",
    "E501",
    "PLC0415",
    "PLR0913",
    "PLR0917",
]
"src/charcot_gym/synth/ehr_web.py" = ["D103", "E501", "PLR0913", "PLR0917"]
"src/charcot_gym/verifier/ehr_web.py" = ["D102", "E501", "PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
